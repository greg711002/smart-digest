# Smart Digest — Docker Compose
# Полный стек для локальной разработки и production

services:
  # Frontend — статические файлы через nginx
  frontend:
    image: nginx:alpine
    container_name: smart-digest-frontend
    ports:
      - "3000:80"
    volumes:
      - ./frontend/dist:/usr/share/nginx/html:ro
      - ./deploy_package/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - smart-digest-network

  # Backend — FastAPI приложение
  backend:
    build:
      context: .
      dockerfile: Dockerfile
      target: backend
    container_name: smart-digest-backend
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
      - HOST=0.0.0.0
      - PORT=8000
      # AI настройки (опционально)
      # - AI_PROVIDER=openai
      # - AI_API_KEY=your-api-key
    volumes:
      - smart-digest-data:/app/backend/data
    restart: unless-stopped
    networks:
      - smart-digest-network

  # Watchtower для автообновления контейнеров (опционально)
  # watchtower:
  #   image: containrrr/watchtower
  #   container_name: smart-digest-watchtower
  #   volumes:
  #     - /var/run/docker.sock:/var/run/docker.sock
  #   environment:
  #     - WATCHTOWER_CLEANUP=true
  #     - WATCHTOWER_POLL_INTERVAL=3600
  #   restart: unless-stopped

volumes:
  smart-digest-data:
    driver: local

networks:
  smart-digest-network:
    driver: bridge
