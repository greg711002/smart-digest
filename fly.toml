# Fly.io configuration
app = "smart-digest"
primary_region = "ams"

[build]
dockerfile = "Dockerfile"

[env]
PORT = "8080"

[http_service]
internal_port = 8080
force_https = true
auto_stop_machines = true
auto_start_machines = true
min_machines_running = 0
processes = ["app"]

[[vm]]
memory = "256mb"
cpu_kind = "shared"
cpus = 1

# Health check
[healthcheck]
port = 8080
path = "/health"
